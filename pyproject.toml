[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "radeonpilot"
dynamic = ["version"]
description = "GUI manager for AMD RDNA3/RDNA4 GPUs on Linux"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.5"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
radeonpilot = "radeonpilot.__main__:main"
radeonpilot-daemon = "radeonpilot.daemon.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "radeonpilot.__version__" }

[tool.setuptools.packages.find]
include = ["radeonpilot*"]

[tool.setuptools.package-data]
radeonpilot = ["data/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
